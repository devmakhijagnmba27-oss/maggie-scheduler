name: Sunday Timetable Scheduler

on:
  # Runs every Sunday at 6:00 PM IST (12:30 UTC)
  schedule:
    - cron: '30 12 * * 0'
    
  # Allows manual run from GitHub Web or Mobile App anytime
  workflow_dispatch:

jobs:
  filter-and-email-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Maggie Calendar Scheduler
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          python auto_run.py
